<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Sunil Poudel — Bring the mess. I'll build the plan.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2457"/>
      <stop offset="0.5" stop-color="#0a1a3f"/>
      <stop offset="1" stop-color="#06152f"/>
    </linearGradient>
    <radialGradient id="glow" cx="16%" cy="26%" r="62%">
      <stop offset="0" stop-color="#2b7bff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2b7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glow)"/>

  <!-- the mess: scattered pieces on the left -->
  <g>
    <rect x="60"  y="58"  width="26" height="26" rx="4" fill="#ff5a4e" opacity="0.92" transform="rotate(18 73 71)"/>
    <rect x="150" y="40"  width="18" height="18" rx="3" fill="#eaf0ff" opacity="0.45" transform="rotate(-22 159 49)"/>
    <rect x="38"  y="150" width="16" height="16" rx="3" fill="#6f86c6" opacity="0.8"  transform="rotate(26 46 158)"/>
    <rect x="120" y="120" width="22" height="22" rx="4" fill="#ffd23f" opacity="0.9"  transform="rotate(32 131 131)"/>
    <rect x="200" y="96"  width="14" height="14" rx="3" fill="#6f86c6" opacity="0.7"  transform="rotate(-16 207 103)"/>
    <rect x="86"  y="250" width="20" height="20" rx="4" fill="#ffd23f" opacity="0.85" transform="rotate(-12 96 260)"/>
    <rect x="170" y="235" width="16" height="16" rx="3" fill="#ff5a4e" opacity="0.72" transform="rotate(14 178 243)"/>
    <rect x="44"  y="214" width="12" height="12" rx="3" fill="#eaf0ff" opacity="0.4"  transform="rotate(20 50 220)"/>
  </g>

  <!-- the identity -->
  <text x="300" y="150" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-1" fill="#eaf0ff">SUNIL POUDEL</text>
  <rect x="302" y="168" width="152" height="5" rx="2" fill="#ffd23f"/>
  <text x="300" y="214" font-family="Consolas, monospace" font-size="24" font-weight="700"><tspan fill="#ff5a4e">Bring the mess.</tspan> <tspan fill="#ffd23f">I'll build the plan.</tspan></text>
  <text x="302" y="250" font-family="Consolas, monospace" font-size="14" letter-spacing="2" fill="#9fb0d8">PROJECT MANAGER · BUILDER BY CURIOSITY · RIYADH</text>

  <!-- the plan: an ordered grid on the right -->
  <g transform="translate(1066,100)">
    <rect x="0"  y="0"  width="20" height="20" rx="4" fill="#eaf0ff" opacity="0.35"/>
    <rect x="30" y="0"  width="20" height="20" rx="4" fill="#6f86c6" opacity="0.6"/>
    <rect x="60" y="0"  width="20" height="20" rx="4" fill="#eaf0ff" opacity="0.3"/>
    <rect x="90" y="0"  width="20" height="20" rx="4" fill="#ffd23f"/>
    <rect x="0"  y="30" width="20" height="20" rx="4" fill="#6f86c6" opacity="0.5"/>
    <rect x="30" y="30" width="20" height="20" rx="4" fill="#ffd23f"/>
    <rect x="60" y="30" width="20" height="20" rx="4" fill="#eaf0ff" opacity="0.5"/>
    <rect x="90" y="30" width="20" height="20" rx="4" fill="#6f86c6" opacity="0.6"/>
    <rect x="0"  y="60" width="20" height="20" rx="4" fill="#eaf0ff" opacity="0.3"/>
    <rect x="30" y="60" width="20" height="20" rx="4" fill="#6f86c6" opacity="0.55"/>
    <rect x="60" y="60" width="20" height="20" rx="4" fill="#ffd23f"/>
    <rect x="90" y="60" width="20" height="20" rx="4" fill="#eaf0ff" opacity="0.4"/>
    <rect x="0"  y="90" width="20" height="20" rx="4" fill="#ffd23f" opacity="0.9"/>
    <rect x="30" y="90" width="20" height="20" rx="4" fill="#eaf0ff" opacity="0.35"/>
    <rect x="60" y="90" width="20" height="20" rx="4" fill="#6f86c6" opacity="0.5"/>
    <rect x="90" y="90" width="20" height="20" rx="4" fill="#eaf0ff" opacity="0.45"/>
  </g>
</svg>
